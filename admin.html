<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPCG ADMIN - Panel de Direction</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">

    <style>
        :root { --primary-color: #9B1C22; --secondary-color: #2b2b2b; --bg-light: #f4f7f6; }
        body { font-family: 'Roboto', sans-serif; background-color: var(--bg-light); overflow-x: hidden; }
        #login-container { height: 100vh; display: flex; align-items: center; justify-content: center; padding: 15px; }
        .login-card { width: 100%; max-width: 400px; padding: 40px; border-radius: 15px; background: white; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .sidebar { background-color: var(--secondary-color); min-height: 100vh; color: white; padding: 20px; position: fixed; width: 250px; z-index: 1000; }
        .main-content { padding: 40px; margin-left: 250px; }
        .table-container, .upload-container { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); margin-bottom: 30px; }
        .nav-link { cursor: pointer; color: rgba(255,255,255,0.6) !important; padding: 12px 15px; transition: 0.3s; }
        .nav-link.active { color: white !important; background-color: var(--primary-color) !important; border-radius: 8px; }
        .accordion-item { border: none; border-radius: 10px !important; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); overflow: hidden;}
        .accordion-button { font-weight: 600; }
        .ql-container { background: #fff; height: 150px; font-size: 14px; }
        @media (max-width: 991px) { .sidebar { display: none; } .main-content { margin-left: 0; } }
    </style>
</head>
<body>

    <!-- LOGIN -->
    <div id="login-container">
        <div class="login-card text-center">
            <h4 class="mb-4 fw-bold">Espace Direction</h4>
            <form id="login-form">
                <input type="email" id="admin-email" class="form-control mb-3" placeholder="Email" required>
                <input type="password" id="admin-password" class="form-control mb-4" placeholder="Mot de passe" required>
                <button type="submit" class="btn btn-danger w-100 mb-3" style="background-color: var(--primary-color);">Connexion</button>
            </form>
            <div id="login-error" class="text-danger mb-3 small" style="display: none;">Accès refusé.</div>
            <a href="index.html" class="text-muted small text-decoration-none">Retour au site</a>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="admin-dashboard" style="display: none;">
        <div class="sidebar">
            <h5 class="mb-5 fw-bold">EPCG ADMIN</h5>
            <ul class="nav flex-column">
                <li class="nav-item"><a id="nav-inscriptions" onclick="switchTab('inscriptions')" class="nav-link active"><i class="bi bi-people me-2"></i> Candidatures</a></li>
                <li class="nav-item mt-2"><a id="nav-media" onclick="switchTab('media')" class="nav-link"><i class="bi bi-camera-reels me-2"></i> Médiathèque</a></li>
                <li class="nav-item mt-2"><a id="nav-partenaires" onclick="switchTab('partenaires')" class="nav-link"><i class="bi bi-building me-2"></i> Partenaires</a></li>
                <li class="nav-item mt-2"><a id="nav-contenu" onclick="switchTab('contenu')" class="nav-link"><i class="bi bi-pencil-square me-2"></i> Édition Site</a></li>
                <li class="nav-item mt-5"><button onclick="handleLogout()" class="btn btn-sm btn-outline-light w-100">Déconnexion</button></li>
            </ul>
        </div>

        <div class="main-content">
            <!-- TAB: CANDIDATURES -->
            <div id="tab-inscriptions">
                <h2 class="fw-bold mb-4">Candidatures reçues</h2>
                <div class="table-container table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light"><tr><th>Nom</th><th>Email</th><th>Tél</th><th>Formation</th><th>Date</th></tr></thead>
                        <tbody id="inscriptions-list"></tbody>
                    </table>
                </div>
            </div>

            <!-- TAB: MEDIA -->
            <div id="tab-media" style="display: none;">
                <h2 class="fw-bold mb-4">Gestion de la Médiathèque</h2>
                <div class="upload-container mb-4">
                    <div class="row g-2 align-items-end">
                        <div class="col-md-6"><input type="file" id="media-file" class="form-control"></div>
                        <div class="col-md-3"><select id="media-type" class="form-select"><option value="image">Image</option><option value="video">Vidéo</option></select></div>
                        <div class="col-md-3"><button onclick="uploadMedia()" id="upload-btn" class="btn btn-danger w-100" style="background-color: var(--primary-color);">Publier</button></div>
                    </div>
                </div>
                <div id="media-gallery" class="row g-3"></div>
            </div>

            <!-- TAB: PARTENAIRES -->
            <div id="tab-partenaires" style="display: none;">
                <h2 class="fw-bold mb-4">Gestion des Partenaires</h2>
                <div class="upload-container mb-4">
                    <div class="row g-3 align-items-end">
                        <div class="col-md-5"><input type="text" id="partenaire-nom" class="form-control" placeholder="Nom"></div>
                        <div class="col-md-5"><input type="file" id="partenaire-logo" class="form-control"></div>
                        <div class="col-md-2"><button onclick="uploadPartenaire()" id="btn-partenaire-add" class="btn btn-danger w-100" style="background-color: var(--primary-color);">Ajouter</button></div>
                    </div>
                </div>
                <div id="partenaires-list" class="row g-3"></div>
            </div>

            <!-- TAB: CMS (CONTENU) -->
            <div id="tab-contenu" style="display: none;">
                <h2 class="fw-bold mb-4">Édition du Site Web</h2>
                <div class="accordion" id="cmsAccordion">
                    
                    <!-- SECTION IDENTITÉ -->
                    <div class="accordion-item">
                        <h2 class="accordion-header"><button class="accordion-button" data-bs-toggle="collapse" data-bs-target="#colIdentity">1. Logos & Coordonnées</button></h2>
                        <div id="colIdentity" class="accordion-collapse collapse show" data-bs-parent="#cmsAccordion">
                            <div class="accordion-body row">
                                <div class="col-md-6 mb-3">
                                    <label class="small fw-bold">Slogan Haut</label>
                                    <div class="input-group"><input type="text" id="input_navbar_slogan" class="form-control"><button class="btn btn-outline-danger" onclick="sauvegarderTexte('navbar_slogan', 'input_navbar_slogan', this)">OK</button></div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="small fw-bold">Logo Navigation</label>
                                    <div class="input-group"><input type="file" id="input_logo_navbar" class="form-control"><button class="btn btn-outline-danger" onclick="sauvegarderImagePosition('logo_navbar', 'input_logo_navbar', this)">OK</button></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- SECTION ACCUEIL -->
                    <div class="accordion-item">
                        <h2 class="accordion-header"><button class="accordion-button collapsed" data-bs-toggle="collapse" data-bs-target="#colHome">2. Page Accueil</button></h2>
                        <div id="colHome" class="accordion-collapse collapse" data-bs-parent="#cmsAccordion">
                            <div class="accordion-body">
                                <label class="small fw-bold">Texte de présentation (Éditeur riche)</label>
                                <div class="quill-editor" id="quill_accueil_about_texte1"></div>
                                <button class="btn btn-danger btn-sm mt-2 w-100" onclick="sauvegarderQuill('accueil_about_texte1', this)">Enregistrer Présentation</button>

                                <div class="row mt-4">
                                    <h6 class="fw-bold text-muted border-bottom pb-2">Les 3 Cartes de Formations</h6>
                                    <div class="col-md-4 mb-3">
                                        <div class="p-2 border rounded">
                                            <input type="text" id="input_accueil_form_1_titre" class="form-control mb-1" placeholder="Titre 1">
                                            <div class="quill-editor" id="quill_accueil_form_1_desc" style="height: 80px;"></div>
                                            <button class="btn btn-sm btn-outline-danger w-100 mt-1" onclick="sauvegarderTexte('accueil_form_1_titre', 'input_accueil_form_1_titre', this); sauvegarderQuill('accueil_form_1_desc', this)">Save 1</button>
                                        </div>
                                    </div>
                                    <div class="col-md-4 mb-3">
                                        <div class="p-2 border rounded">
                                            <input type="text" id="input_accueil_form_2_titre" class="form-control mb-1" placeholder="Titre 2">
                                            <div class="quill-editor" id="quill_accueil_form_2_desc" style="height: 80px;"></div>
                                            <button class="btn btn-sm btn-outline-danger w-100 mt-1" onclick="sauvegarderTexte('accueil_form_2_titre', 'input_accueil_form_2_titre', this); sauvegarderQuill('accueil_form_2_desc', this)">Save 2</button>
                                        </div>
                                    </div>
                                    <div class="col-md-4 mb-3">
                                        <div class="p-2 border rounded">
                                            <input type="text" id="input_accueil_form_3_titre" class="form-control mb-1" placeholder="Titre 3">
                                            <div class="quill-editor" id="quill_accueil_form_3_desc" style="height: 80px;"></div>
                                            <button class="btn btn-sm btn-outline-danger w-100 mt-1" onclick="sauvegarderTexte('accueil_form_3_titre', 'input_accueil_form_3_titre', this); sauvegarderQuill('accueil_form_3_desc', this)">Save 3</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script>
        const SUPABASE_URL = 'https://aytyetcwfzliikljlhhz.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_KV2wU4WAzWJgRVlgIoioWA_MnLEtnCz'; 
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // QUILL
        const quillEditors = {};
        const qOptions = { theme: 'snow', modules: { toolbar: [['bold', 'italic'], [{list:'bullet'}], ['clean']] } };
        document.querySelectorAll('.quill-editor').forEach(el => {
            const id = el.id.replace('quill_', '');
            quillEditors[id] = new Quill(el, qOptions);
        });

        // TABS
        function switchTab(tab) {
            ['inscriptions', 'media', 'partenaires', 'contenu'].forEach(t => document.getElementById(`tab-${t}`).style.display = t === tab ? 'block' : 'none');
            document.querySelectorAll('.nav-link').forEach(l => l.classList.toggle('active', l.id === `nav-${tab}`));
            if(tab === 'media') fetchGallery(); if(tab === 'partenaires') fetchPartenaires(); if(tab === 'contenu') fetchContenu();
        }

        // LOGIN
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const { error } = await _supabase.auth.signInWithPassword({ email: document.getElementById('admin-email').value, password: document.getElementById('admin-password').value });
            if (error) document.getElementById('login-error').style.display = 'block';
            else { document.getElementById('login-container').style.display = 'none'; document.getElementById('admin-dashboard').style.display = 'block'; fetchInscriptions(); }
        });

        // CMS LOGIC
        async function fetchContenu() {
            const { data } = await _supabase.from('contenu_site').select('*');
            data?.forEach(item => {
                const inp = document.getElementById('input_'+item.cle_position);
                if(inp) inp.value = item.valeur;
                if(quillEditors[item.cle_position]) quillEditors[item.cle_position].root.innerHTML = item.valeur;
            });
        }

        async function sauvegarderTexte(cle, id, btn) {
            const val = document.getElementById(id).value;
            await _supabase.from('contenu_site').upsert({ cle_position: cle, valeur: val, type: 'texte' });
            btn.innerHTML = "✓"; setTimeout(() => btn.innerHTML = "OK", 2000);
        }

        async function sauvegarderQuill(cle, btn) {
            const val = quillEditors[cle].root.innerHTML;
            await _supabase.from('contenu_site').upsert({ cle_position: cle, valeur: val, type: 'html' });
            btn.innerHTML = "Enregistré !"; setTimeout(() => btn.innerHTML = "Sauvegarder", 2000);
        }

        async function sauvegarderImagePosition(cle, id, btn) {
            const file = document.getElementById(id).files[0];
            if(!file) return;
            const name = `img_${Date.now()}_${file.name}`;
            await _supabase.storage.from('media').upload(name, file);
            const { data: { publicUrl } } = _supabase.storage.from('media').getPublicUrl(name);
            await _supabase.from('contenu_site').upsert({ cle_position: cle, valeur: publicUrl, type: 'image_url' });
            btn.innerHTML = "✓";
        }

        // INSCRIPTIONS
        async function fetchInscriptions() {
            const { data } = await _supabase.from('inscriptions').select('*').order('created_at', {ascending: false});
            document.getElementById('inscriptions-list').innerHTML = data.map(i => `<tr><td>${i.nom_prenom}</td><td>${i.email}</td><td>${i.telephone_1}</td><td>${i.formation}</td><td>${new Date(i.created_at).toLocaleDateString()}</td></tr>`).join('');
        }

        // MEDIA
        async function uploadMedia() {
            const file = document.getElementById('media-file').files[0];
            if(!file) return;
            const name = `med_${Date.now()}_${file.name}`;
            await _supabase.storage.from('media').upload(name, file);
            const { data: { publicUrl } } = _supabase.storage.from('media').getPublicUrl(name);
            await _supabase.from('gallery').insert([{ url: publicUrl, type: document.getElementById('media-type').value }]);
            fetchGallery();
        }

        async function fetchGallery() {
            const { data } = await _supabase.from('gallery').select('*').order('created_at', {ascending: false});
            document.getElementById('media-gallery').innerHTML = data.map(m => `<div class="col-md-3"><div class="card p-1">${m.type==='image'?`<img src="${m.url}" height="100" style="object-fit:cover;">`:`<video src="${m.url}" height="100"></video>`}<button class="btn btn-sm btn-outline-danger w-100 mt-1" onclick="deleteMedia(${m.id}, '${m.url}')">Suppr.</button></div></div>`).join('');
        }

        async function deleteMedia(id, url) {
            await _supabase.from('gallery').delete().eq('id', id);
            await _supabase.storage.from('media').remove([url.split('/').pop()]);
            fetchGallery();
        }

        // PARTENAIRES
        async function uploadPartenaire() {
            const file = document.getElementById('partenaire-logo').files[0];
            if(!file) return;
            const name = `part_${Date.now()}_${file.name}`;
            await _supabase.storage.from('media').upload(name, file);
            const { data: { publicUrl } } = _supabase.storage.from('media').getPublicUrl(name);
            await _supabase.from('partenaires').insert([{ nom: document.getElementById('partenaire-nom').value, logo_url: publicUrl }]);
            fetchPartenaires();
        }

        async function fetchPartenaires() {
            const { data } = await _supabase.from('partenaires').select('*');
            document.getElementById('partenaires-list').innerHTML = data.map(p => `<div class="col-6 col-md-2 text-center"><div class="card p-2 shadow-sm"><img src="${p.logo_url}" height="40" style="object-fit:contain;"><button class="btn btn-sm text-danger mt-1" onclick="deletePartenaire(${p.id}, '${p.logo_url}')">X</button></div></div>`).join('');
        }

        async function deletePartenaire(id, url) {
            await _supabase.from('partenaires').delete().eq('id', id);
            await _supabase.storage.from('media').remove([url.split('/').pop()]);
            fetchPartenaires();
        }

        async function handleLogout() { await _supabase.auth.signOut(); window.location.reload(); }
    </script>
</body>
</html>
