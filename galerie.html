<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Médiathèque - EPCG Tanger</title>
    
    <!-- LIBRAIRIES EXTERNES -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&family=Roboto+Slab:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <!-- SDK SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- VOTRE CSS GLOBAL -->
    <link rel="stylesheet" href="style.css">

    <style>
        /* CSS SPÉCIFIQUE À LA PAGE GALERIE UNIQUEMENT */
        
        /* HEADER PAGE */
        .page-header { background: linear-gradient(rgba(155, 28, 34, 0.8), rgba(155, 28, 34, 0.8)), url('https://images.unsplash.com/photo-1523050854058-8df90110c9f1?q=80&w=2000'); background-size: cover; background-position: center; color: white; padding: 100px 0; text-align: center; margin-bottom: 50px; }
        .page-header h1 { font-family: 'Roboto Slab', serif; font-size: 3.5rem; font-weight: 700; text-transform: uppercase; }

        /* FILTRES */
        .filter-btn { border: 1px solid #ddd; background: white; color: var(--secondary-color); padding: 8px 25px; border-radius: 5px; margin: 5px; transition: 0.3s; font-weight: 500; }
        .filter-btn.active { background-color: var(--primary-color); color: white; border-color: var(--primary-color); }

        /* GALERIE */
        .media-card { border-radius: 15px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.08); transition: 0.4s; background: white; height: 100%; }
        .media-card:hover { transform: translateY(-10px); }
        .media-container { position: relative; height: 250px; cursor: pointer; }
        .media-container img, .media-container video { width: 100%; height: 100%; object-fit: cover; }
        .play-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 3rem; opacity: 0.8; }

        @media (max-width: 991px) {
            .page-header h1 { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

    <!-- 1. INJECTION DE LA NAVBAR -->
    <div id="navbar-placeholder"></div>

    <header class="page-header">
        <div class="container">
            <h1 data-aos="fade-down">Notre Médiathèque</h1>
            <p class="lead" data-aos="fade-up" data-aos-delay="200">Immersion au cœur de la vie étudiante de l'EPCG Tanger</p>
        </div>
    </header>

    <section class="container mb-5">
        <!-- FILTRES -->
        <div class="text-center mb-5" data-aos="fade-up">
            <button class="filter-btn active" onclick="filterMedia('all', this)">Tout voir</button>
            <button class="filter-btn" onclick="filterMedia('image', this)">Photos</button>
            <button class="filter-btn" onclick="filterMedia('video', this)">Vidéos</button>
        </div>

        <!-- GRILLE DE MÉDIAS -->
        <div class="row g-4" id="gallery-container">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-danger"></div>
            </div>
        </div>
    </section>

    <!-- 2. INJECTION DU FOOTER -->
    <div id="footer-placeholder"></div>

    <!-- SCRIPTS EXTERNES -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    
    <!-- VOTRE SCRIPT GLOBAL (Contient Supabase, Navbar, Footer) -->
    <script src="main.js"></script>

    <!-- SCRIPT SPÉCIFIQUE À LA GALERIE -->
    <script>
        AOS.init({ once: true });

        let allMedia = [];

        // CHARGEMENT DE LA GALERIE (Utilise la variable _supabase du fichier main.js)
        async function loadGallery() {
            const { data, error } = await _supabase.from('gallery').select('*').order('created_at', { ascending: false });
            if (!error && data) {
                allMedia = data;
                renderGallery(allMedia);
            }
        }

        // AFFICHAGE DES CARTES
        function renderGallery(items) {
            const container = document.getElementById('gallery-container');
            if (items.length === 0) {
                container.innerHTML = '<div class="col-12 text-center text-muted">Aucun média disponible.</div>';
                return;
            }
            container.innerHTML = items.map(item => `
                <div class="col-md-6 col-lg-4" data-aos="zoom-in">
                    <div class="media-card">
                        <div class="media-container" onclick="window.open('${item.url}', '_blank')">
                            ${item.type === 'image' 
                                ? `<img src="${item.url}" alt="Galerie">` 
                                : `<video src="${item.url}"></video><div class="play-overlay"><i class="bi bi-play-circle-fill"></i></div>`}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // SYSTÈME DE FILTRES
        function filterMedia(type, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const filtered = type === 'all' ? allMedia : allMedia.filter(m => m.type === type);
            renderGallery(filtered);
        }

        // On attend un petit instant pour être sûr que main.js a bien chargé Supabase
        setTimeout(() => {
            loadGallery();
        }, 500);
    </script>
</body>
</html>
