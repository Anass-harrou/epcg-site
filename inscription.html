<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - EPCG Tanger</title>
    
    <!-- LIBRAIRIES EXTERNES -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&family=Roboto+Slab:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- VOTRE CSS GLOBAL -->
    <link rel="stylesheet" href="style.css">

    <style>
        /* CSS SPÉCIFIQUE À LA PAGE INSCRIPTION UNIQUEMENT */
        
        /* HEADER PAGE AVEC VIDÉO */
        .page-header {
            position: relative; height: 45vh; min-height: 350px; display: flex; align-items: center;
            justify-content: center; text-align: center; color: white; overflow: hidden; margin-top: -115px;
        }
        .background-video {
            position: absolute; top: 50%; left: 50%; min-width: 100%; min-height: 100%;
            transform: translateX(-50%) translateY(-50%); z-index: -2; object-fit: cover;
        }
        .video-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(43, 43, 43, 0.7), rgba(155, 28, 34, 0.8)); z-index: -1;
        }
        .page-title { font-family: 'Roboto Slab', serif; font-size: 3rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3);}

        /* FORMULAIRE PREMIUM */
        .form-container {
            background-color: #ffffff; border-radius: 16px; box-shadow: 0 15px 50px rgba(0,0,0,0.05);
            padding: 50px; margin-top: -60px; margin-bottom: 80px; position: relative; z-index: 10;
        }
        .form-control-custom {
            background-color: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px;
            padding: 15px 20px; font-size: 1rem; margin-bottom: 25px; transition: 0.3s;
        }
        .form-control-custom:focus { border-color: var(--primary-color); box-shadow: 0 0 0 4px rgba(155, 28, 34, 0.1); outline: none; }
        .form-label-custom { font-weight: 600; color: var(--secondary-color); margin-bottom: 10px; display: block; text-transform: uppercase; font-size: 0.85rem; }
        .btn-submit {
            background-color: var(--primary-color); color: white; padding: 16px; font-weight: 600;
            border-radius: 8px; border: none; width: 100%; text-transform: uppercase; transition: 0.4s;
        }
        .btn-submit:hover:not(:disabled) { background-color: #7a151a; transform: translateY(-3px); box-shadow: 0 10px 20px rgba(155, 28, 34, 0.25); }

        /* RADIO CARDS */
        .radio-card {
            border: 2px solid #f0f0f0; border-radius: 10px; padding: 18px 20px; cursor: pointer;
            display: flex; align-items: center; margin-bottom: 15px; transition: 0.3s;
        }
        .radio-card:hover { border-color: var(--primary-color); background: #fffcfc; }
        .radio-card input { margin-right: 20px; transform: scale(1.4); accent-color: var(--primary-color); }

        @media (max-width: 991px) {
            .page-header { margin-top: -85px; }
            .page-title { font-size: 2.2rem; }
            .form-container { padding: 30px; }
        }
    </style>
</head>
<body>

    <!-- 1. INJECTION DE LA NAVBAR -->
    <div id="navbar-placeholder"></div>

    <header class="page-header">
        <div class="video-overlay"></div>
        <video class="background-video" autoplay muted loop playsinline>
            <source src="./assets/video-epcg.mp4" type="video/mp4">
        </video>
        <div class="container position-relative" data-aos="zoom-in" style="z-index: 2;">
            <h1 class="page-title">Candidature en ligne</h1>
            <p class="lead text-white">Préparez votre avenir professionnel avec l'EPCG Tanger</p>
        </div>
    </header>

    <section class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="form-container" data-aos="fade-up">
                    <div id="formHeader" class="text-center mb-5">
                        <h2 style="color: var(--secondary-color);">Dossier d'Admission</h2>
                        <p class="text-muted">Remplissez le formulaire ci-dessous pour postuler.</p>
                    </div>

                    <form id="epcgForm">
                        <label class="form-label-custom">Nom et Prénom *</label>
                        <input type="text" name="Nom_Prenom" class="form-control-custom w-100" placeholder="Votre nom complet" required>

                        <label class="form-label-custom">Email *</label>
                        <input type="email" name="Email" class="form-control-custom w-100" placeholder="adresse@email.com" required>

                        <div class="row">
                            <div class="col-md-6">
                                <label class="form-label-custom">Téléphone 1 *</label>
                                <input type="tel" name="Telephone_1" class="form-control-custom w-100" placeholder="06 00 00 00 00" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label-custom">Téléphone 2</label>
                                <input type="tel" name="Telephone_2" class="form-control-custom w-100" placeholder="(Facultatif)">
                            </div>
                        </div>

                        <label class="form-label-custom mt-3 mb-3">Formation souhaitée *</label>
                        <div class="mb-5">
                            <label class="radio-card">
                                <input type="radio" name="Formation" value="Technicien_Specialise" required>
                                <div><strong>Technicien Spécialisé</strong> <span class="badge ms-2" style="background-color: var(--primary-color);">Bac+2</span></div>
                            </label>
                            <label class="radio-card">
                                <input type="radio" name="Formation" value="Bachelor">
                                <div><strong>Bachelor / Licence</strong> <span class="badge ms-2" style="background-color: var(--primary-color);">Bac+3</span></div>
                            </label>
                            <label class="radio-card">
                                <input type="radio" name="Formation" value="Master">
                                <div><strong>Master Professionnel</strong> <span class="badge ms-2" style="background-color: var(--primary-color);">Bac+5</span></div>
                            </label>
                        </div>

                        <button type="submit" id="submitBtn" class="btn-submit">
                            Envoyer ma candidature <i class="bi bi-arrow-right ms-2"></i>
                        </button>
                    </form>

                    <div id="successMessage" class="text-center py-5" style="display:none;">
                        <i class="bi bi-check-circle-fill" style="font-size: 70px; color: #198754;"></i>
                        <h2 class="mt-4 mb-3">Candidature Enregistrée !</h2>
                        <p class="text-muted fs-5">L'administration vous recontactera très rapidement.</p>
                        <a href="index.html" class="btn btn-outline-dark mt-4 px-5">Retour au site</a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 2. INJECTION DU FOOTER -->
    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    
    <!-- VOTRE SCRIPT GLOBAL (Contient Supabase, Navbar, Footer) -->
    <script src="main.js"></script>
    
    <!-- SCRIPT SPÉCIFIQUE À L'INSCRIPTION -->
    <script> 
        AOS.init({ once: true }); 

        // Envoi du formulaire à Supabase
        // On utilise un setTimeout pour être certain que la variable globale _supabase (dans main.js) est bien chargée.
        setTimeout(() => {
            const form = document.getElementById('epcgForm');
            if(form) {
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const btn = document.getElementById('submitBtn');
                    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Transmission...';
                    btn.disabled = true;

                    const formData = new FormData(e.target);
                    // _supabase provient de main.js
                    const { error } = await _supabase.from('inscriptions').insert([{
                        nom_prenom: formData.get('Nom_Prenom'),
                        email: formData.get('Email'),
                        telephone_1: formData.get('Telephone_1'),
                        telephone_2: formData.get('Telephone_2'),
                        formation: formData.get('Formation')
                    }]);

                    if (error) {
                        alert('Erreur : ' + error.message);
                        btn.innerHTML = 'Envoyer ma candidature <i class="bi bi-arrow-right ms-2"></i>';
                        btn.disabled = false;
                    } else {
                        document.getElementById('epcgForm').style.display = 'none';
                        document.getElementById('formHeader').style.display = 'none';
                        document.getElementById('successMessage').style.display = 'block';
                    }
                });
            }
        }, 500); 
    </script>
</body>
</html>
